# After photos or posts change (e.g. a save in Pages CMS), name photos after their posts and shrink
# oversized originals, then commit the result. See scripts/tidy-photos.mjs.
name: Tidy photos

on:
  push:
    branches: [main]
    paths: ['src/content/blog/**', 'src/assets/blog/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tidy-photos

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run photos
      - name: Commit any changes
        run: |
          if [ -n "$(git status --porcelain src/content/blog src/assets/blog)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A src/content/blog src/assets/blog
            git commit -m "Tidy Field Notes photos: name after posts, shrink large originals"
            git push
          fi
